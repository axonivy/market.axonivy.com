services:
  web:
    build: ./docker/apache
    volumes:
      - ./:/var/www/html
      - ./docker/apache/000-default.conf:/etc/apache2/sites-available/000-default.conf
      - ../frontend/.market/market-bundle/products:/market-data/products:ro
      - ../frontend/.market/products.json:/market-data/products.json:ro
      - ../frontend/public/market-cache:/market-cache:ro
    environment:
      MARKET_PRODUCTS_DIR: /market-data/products
      MARKET_INDEX_FILE: /market-data/products.json
      MARKET_CACHE_DIR: /market-cache
    ports:
      - 80:80
