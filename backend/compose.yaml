services:
  composer:
    build:
      context: ..
      dockerfile: build/Dockerfile.composer
    working_dir: /app
    volumes:
      - ./:/app
  web:
    build: ./docker/apache
    volumes:
      - ./:/var/www/html
      - ./docker/apache/000-default.conf:/etc/apache2/sites-available/000-default.conf
      - ../frontend/dist:/var/www/html/frontend-dist
      - ./src/web/frontend-index.php:/var/www/html/frontend-dist/index.php:ro
      - ../frontend/.market:/market:ro
    environment:
      MARKET_PRODUCTS_DIR: /market/meta-catalog/products
      MARKET_INDEX_FILE: /market/product-index.json
      MARKET_CACHE_DIR: /market/maven-products
    ports:
      - 80:80
